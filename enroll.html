<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Enroll | Velentora</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      background:#f8fafc;
      color:#0f172a;

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:40px;
    }

    .container{

      width:100%;
      max-width:700px;

      background:white;

      padding:50px;

      border-radius:30px;

      box-shadow:0 20px 50px rgba(0,0,0,0.08);
    }

    h1{
      font-size:42px;
      margin-bottom:10px;
      color:#2563eb;
    }

    p{
      color:#64748b;
      margin-bottom:40px;
      line-height:1.7;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    input,
    select,
    textarea{

      padding:18px;

      border-radius:16px;

      border:1px solid #cbd5e1;

      outline:none;

      font-size:16px;

      transition:0.3s;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,0.1);
    }

    textarea{
      min-height:140px;
      resize:none;
    }

    button{

      padding:18px;

      border:none;

      border-radius:18px;

      background:#2563eb;

      color:white;

      font-size:17px;

      font-weight:600;

      cursor:pointer;

      transition:0.3s;

      box-shadow:0 12px 30px rgba(37,99,235,0.2);
    }

    button:hover{
      transform:translateY(-4px);
    }

    .back{

      display:inline-block;

      margin-top:25px;

      text-decoration:none;

      color:#2563eb;

      font-weight:600;
    }

    @media(max-width:768px){

      .container{
        padding:35px;
      }

      h1{
        font-size:34px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Enroll at Velentora</h1>

    <p>
      Begin your learning journey and unlock premium courses designed for the future.
    </p>

    <form action="https://formspree.io/f/xbdwewqq" method="POST">

      <input
        type="text"
        name="name"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="Email Address"
        required
      >

      <select name="course" required>

        <option value="">
          Select Course
        </option>

        <option>
          AI & Machine Learning
        </option>

        <option>
          Web Development
        </option>

        <option>
          UI/UX Design
        </option>

        <option>
          Python Programming
        </option>

        <option>
          Cybersecurity
        </option>

        <option>
          Business & Finance
        </option>

      </select>

      <textarea
        name="message"
        placeholder="Why do you want to join this course?"
      ></textarea>

      <button type="submit">
        Complete Enrollment
      </button>

    </form>

    <a href="index.html" class="back">
      ? Back to Homepage
    </a>

  </div>

</body>
</html>
